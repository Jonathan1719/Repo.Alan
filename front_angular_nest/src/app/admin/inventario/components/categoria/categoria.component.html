<section class="card">
  <h1>Categorías</h1>

  <div *ngIf="errorMessage && !dialogVisible" class="p-error mb-3" role="alert">
    {{ errorMessage }}
  </div>

  <p-button
    label="Nueva categoría"
    icon="pi pi-plus"
    (onClick)="abrirDialogo()"
  ></p-button>

  <p-table
    [value]="categorias"
    [loading]="loading"
    responsiveLayout="scroll"
    styleClass="mt-3"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Detalle</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-categoria>
      <tr>
        <td>{{ categoria.id }}</td>
        <td>{{ categoria.nombre }}</td>
        <td>{{ categoria.detalle }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">No hay categorías registradas.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<p-dialog
  header="Nueva categoría"
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '30rem' }"
>
  <form [formGroup]="categoriaForm" (ngSubmit)="guardarCategoria()" id="categoria-form">
    <div class="field">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        pInputText
        formControlName="nombre"
        maxlength="100"
        class="w-full"
        autofocus
      >
      <small
        *ngIf="categoriaForm.controls.nombre.invalid && categoriaForm.controls.nombre.touched"
        class="p-error"
      >
        El nombre es obligatorio (máximo 100 caracteres).
      </small>
    </div>

    <div class="field">
      <label for="detalle">Detalle</label>
      <input
        id="detalle"
        type="text"
        pInputText
        formControlName="detalle"
        maxlength="255"
        class="w-full"
      >
      <small
        *ngIf="categoriaForm.controls.detalle.invalid && categoriaForm.controls.detalle.touched"
        class="p-error"
      >
        El detalle es obligatorio (máximo 255 caracteres).
      </small>
    </div>

    <p *ngIf="errorMessage && dialogVisible" class="p-error" role="alert">
      {{ errorMessage }}
    </p>
  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancelar"
      icon="pi pi-times"
      severity="secondary"
      [text]="true"
      [disabled]="saving"
      (onClick)="dialogVisible = false"
    ></p-button>
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="saving"
      [disabled]="categoriaForm.invalid || saving"
      (onClick)="guardarCategoria()"
    ></p-button>
  </ng-template>
</p-dialog>
